[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teachx-api"
version = "0.1.0"
description = "TeachX web-first AI tutoring backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "bcrypt>=5.0.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "openai>=1.109.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pyjwt>=2.15.1",
  "pypdf>=6.19.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teachx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
