name: teachx

services:
  api:
    build:
      context: ./backend
    environment:
      TEACHX_HOST: 0.0.0.0
      TEACHX_PORT: 8010
      TEACHX_DATABASE_PATH: /app/data/teachx.db
      TEACHX_KNOWLEDGE_ROOT: /app/data/knowledge
      TEACHX_MAX_UPLOAD_BYTES: ${TEACHX_MAX_UPLOAD_BYTES:-20971520}
      TEACHX_LLM_PROVIDER: ${TEACHX_LLM_PROVIDER:-mock}
      TEACHX_MODEL: ${TEACHX_MODEL:-gpt-4.1-mini}
      TEACHX_EMBEDDING_PROVIDER: ${TEACHX_EMBEDDING_PROVIDER:-mock}
      TEACHX_EMBEDDING_MODEL: ${TEACHX_EMBEDDING_MODEL:-text-embedding-3-small}
      TEACHX_AUTH_ENABLED: ${TEACHX_AUTH_ENABLED:-false}
      TEACHX_AUTH_SECRET: ${TEACHX_AUTH_SECRET:-dev-only-change-this-secret-before-production}
      TEACHX_AUTH_COOKIE_SECURE: ${TEACHX_AUTH_COOKIE_SECURE:-false}
      TEACHX_AUTH_TOKEN_TTL_MINUTES: ${TEACHX_AUTH_TOKEN_TTL_MINUTES:-1440}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    volumes:
      - teachx-data:/app/data
    ports:
      - "${TEACHX_API_PORT:-8010}:8010"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_AUTH_ENABLED: ${TEACHX_AUTH_ENABLED:-false}
    environment:
      DEEPTUTOR_API_BASE_URL: http://api:8010
      DEEPTUTOR_AUTH_ENABLED: ${TEACHX_AUTH_ENABLED:-false}
    ports:
      - "${TEACHX_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  teachx-data:
